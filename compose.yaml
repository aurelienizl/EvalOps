services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    volumes:
      - ./frontend/public:/usr/share/nginx/html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - frontend_backend
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    volumes:
      - backend_data:/data
      - ./courses:/courses:ro
    environment:
      - COURSES_PATH=/courses
      - DATABASE_PATH=/data/app.db
      - CONTAINER_MANAGER_URL=http://container_manager:8001
    networks:
      - frontend_backend
      - backend_manager
    depends_on:
      container_manager:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/ready"]
      interval: 30s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  container_manager:
    build:
      context: .
      dockerfile: container_manager/Dockerfile
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./courses:/courses:ro
      - /tmp:/tmp
      - /var/lib/docker/volumes:/var/lib/docker/volumes
      - manager_data:/data
    environment:
      - COURSES_PATH=/courses
      - PLATFORM_INSTANCE=${PLATFORM_INSTANCE:-evalops-prod}
      - SSH_HOST=${SSH_HOST:-localhost}
      - SSH_BIND_ADDRESS=${SSH_BIND_ADDRESS:-0.0.0.0}
      - SSH_PORT_MIN=${SSH_PORT_MIN:-22000}
      - SSH_PORT_MAX=${SSH_PORT_MAX:-22999}
    networks:
      - backend_manager
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/v1/health"]
      start_period: ${CONTAINER_MANAGER_START_PERIOD:-30m}
      interval: 30s
      timeout: 3s
      retries: 10
    restart: unless-stopped

networks:
  frontend_backend:
    driver: bridge
  backend_manager:
    driver: bridge

volumes:
  backend_data:
  manager_data:
