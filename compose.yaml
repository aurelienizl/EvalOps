services:
  db:
    image: postgres:18-bookworm
    environment:
      POSTGRES_DB: evalops
      POSTGRES_USER: evalops_owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      BACKEND_DB_PASSWORD: ${BACKEND_DB_PASSWORD:?Set BACKEND_DB_PASSWORD}
      MANAGER_DB_PASSWORD: ${MANAGER_DB_PASSWORD:?Set MANAGER_DB_PASSWORD}
    volumes:
      - database:/var/lib/postgresql
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./db/init-roles.sh:/docker-entrypoint-initdb.d/02-roles.sh:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U evalops_owner -d evalops']
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  container_manager:
    build:
      context: .
      dockerfile: container_manager/Dockerfile
    environment:
      DATABASE_URL: postgresql://evalops_manager:${MANAGER_DB_PASSWORD}@db/evalops
      COURSES_ROOT: /app/courses
      DATA_ROOT: ${DATA_ROOT:-/var/lib/evalops}
      DATA_SHARED_GID: 10001
      DEPLOYMENT_ID: ${DEPLOYMENT_ID:-evalops}
      SSH_BIND_ADDRESS: ${SSH_BIND_ADDRESS:-0.0.0.0}
      SSH_PORT_MIN: ${SSH_PORT_MIN:-20000}
      SSH_PORT_MAX: ${SSH_PORT_MAX:-30000}
      POLL_INTERVAL_SECONDS: ${POLL_INTERVAL_SECONDS:-1}
      ENVIRONMENT_TTL_SECONDS: ${ENVIRONMENT_TTL_SECONDS:-43200}
    volumes:
      - ./courses:/app/courses:ro
      - ${DATA_ROOT:-/var/lib/evalops}:${DATA_ROOT:-/var/lib/evalops}
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, 'import urllib.request; urllib.request.urlopen("http://localhost:8001/ready",timeout=2)']
      interval: 5s
      timeout: 3s
      retries: 120
      start_period: 10m
    restart: unless-stopped
    stop_grace_period: 60s
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql://evalops_backend:${BACKEND_DB_PASSWORD}@db/evalops
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      COURSES_ROOT: /app/courses
      DATA_ROOT: ${DATA_ROOT:-/var/lib/evalops}
      SSH_HOST: ${SSH_HOST:-localhost}
      MAX_ENVIRONMENTS: ${MAX_ENVIRONMENTS:-20}
    expose:
      - 8080
    volumes:
      - ./courses:/app/courses:ro
      - ${DATA_ROOT:-/var/lib/evalops}/snapshots:${DATA_ROOT:-/var/lib/evalops}/snapshots:ro
    depends_on:
      db:
        condition: service_healthy
      container_manager:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, 'import urllib.request; urllib.request.urlopen("http://localhost:8080/healthz",timeout=2)']
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - 127.0.0.1:8080:8080
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1:8080/]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped
volumes:
  database:
