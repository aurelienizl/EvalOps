server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 10M;

    # Security and cache headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Cache-Control "no-cache, must-revalidate" always;

    # Reverse proxy for backend API
    location /api/ {
        # Resolve service addresses again when Docker recreates the backend.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend_url http://backend:8000;
        proxy_pass $backend_url$request_uri;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts aligned with spec (420s)
        proxy_connect_timeout 10s;
        proxy_send_timeout 420s;
        proxy_read_timeout 420s;
    }

    # Static assets and SPA routing fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
