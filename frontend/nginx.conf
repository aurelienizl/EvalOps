# This file is included in the main http context by the Nginx image.
# Use fixed keys for shared, app-wide caps: NPM's trusted address is deployment
# specific, so forwarded client-IP headers are deliberately not trusted here.
# Empty keys exempt static assets, documentation and health checks.
map $uri $evalops_api_limit_key {
    default "";
    ~^/api/ evalops;
}

map $uri $evalops_password_limit_key {
    default "";
    ~^/api/v1/(auth/login|profile/password)/?$ evalops;
}

limit_req_zone $evalops_api_limit_key zone=evalops_api:1m rate=100r/s;
limit_req_zone $evalops_password_limit_key zone=evalops_password:1m rate=2r/s;

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    client_max_body_size 32k;
    client_body_timeout 15s;
    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    limit_req zone=evalops_api burst=100 nodelay;
    # Pace expensive password hashing; queue up to 20 excess requests (10s).
    limit_req zone=evalops_password burst=20;
    limit_req_status 429;
    limit_req_log_level warn;
    error_page 429 = @rate_limited;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream backend:8080;

    location /api/ {
        proxy_pass http://$api_upstream$request_uri;
        proxy_set_header Host $host;
        add_header Cache-Control "no-store" always;
    }
    location ~ ^/(docs|redoc|openapi\.json|healthz)(/|$) {
        proxy_pass http://$api_upstream$request_uri;
        proxy_set_header Host $host;
        add_header Cache-Control "no-store" always;
    }
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache" always;
    }
    location @rate_limited {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header Retry-After "1" always;
        return 429 '{"detail":"Too many requests. Please retry shortly."}';
    }
}
