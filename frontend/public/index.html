<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <meta
      name="description"
      content="EvalOps — practical DevOps courses, development environments and assessments."
    />
    <title>EvalOps — Workspace Console</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23070709'/%3E%3Cpath d='m7 9 7 7-7 7m10 0h8' fill='none' stroke='white' stroke-width='3'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="/styles.css" />
    <script src="/vendor/purify.js"></script>
    <script type="module" src="/js/app.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="app-header">
      <a class="brand-link" href="#courses" aria-label="EvalOps courses">
        <span class="brand-icon" aria-hidden="true">&gt;_</span>
        <span class="brand-title">EVALOPS</span
        ><span class="brand-badge">RUNTIME</span>
      </a>
      <nav id="app-nav" aria-label="Main navigation" hidden>
        <a class="nav-link" href="#courses" data-nav="courses">Courses</a>
        <a class="nav-link" href="#profile" data-nav="profile">Profile</a>
        <a class="nav-link" href="#admin" data-nav="admin" id="nav-admin" hidden
          >Admin</a
        >
        <div class="user-badge">
          <span class="status-dot" aria-hidden="true"></span>
          <span id="user-role" class="tag" hidden>ADMIN</span
          ><span id="user-email"></span>
          <button
            id="logout"
            class="btn btn-ghost"
            type="button"
            title="Sign out"
            aria-label="Sign out"
          >
            ↪
          </button>
        </div>
      </nav>
    </header>
    <aside
      id="runtime-banner"
      class="runtime-banner"
      aria-label="Development environment"
      hidden
    ></aside>
    <main id="main" class="main-content" tabindex="-1">
      <p class="loading-message" role="status">Connecting to your workspace…</p>
    </main>
    <footer class="app-footer">
      <span
        ><strong>EVALOPS</strong> <span class="text-dim">//</span> Automated
        DevOps Assessment Platform</span
      ><span>Made with &lt;3 by Oreo</span>
    </footer>
    <div
      id="toasts"
      class="toast-container"
      role="status"
      aria-live="polite"
      aria-atomic="false"
    ></div>
    <dialog id="report-dialog" aria-labelledby="report-title">
      <div class="modal-header">
        <h2 id="report-title">Evaluation report</h2>
        <button
          class="btn btn-ghost"
          type="button"
          id="report-close"
          aria-label="Close evaluation report"
        >
          ×
        </button>
      </div>
      <div id="report-body" class="modal-body"></div>
    </dialog>
    <noscript
      ><p class="alert">
        JavaScript is required to use the workspace console.
      </p></noscript
    >
  </body>
</html>
